site_name: VibeNavigator Documentation
site_description: Documentation for the VibeNavigator project
site_author: VibeNavigator Team

# Repository
repo_name: VibeNavigator
repo_url: https://github.com/yourusername/VibeNavigator
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2023 VibeNavigator Team

# Configuration
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true

# Navigation structure
nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/index.md
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
  - API Documentation:
    - Overview: api/index.md
    - Authentication: api/authentication.md
  - User Guides:
    - Overview: user-guides/index.md
  - Development:
    - Overview: development/index.md

# Plugins
plugins:
  - search
